name: Schedule Test

on:
  schedule:
    - cron: '20 10 * * *'
      timezone: 'America/Los_Angeles'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show time
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "UTC: $(date -u)"
          echo "Pacific: $(TZ=America/Los_Angeles date)"
